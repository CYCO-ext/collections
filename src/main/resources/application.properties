quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
# MongoDB Configuration
quarkus.mongodb.connection-string=${QUARKUS_MONGODB_CONNECTION_STRING}
quarkus.mongodb.database=collections
# Kafka Bootstrap Servers
kafka.bootstrap.servers=${QUARKUS_KAFKA_BOOTSTRAP_SERVERS}
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${QUARKUS_KAFKA_BOOTSTRAP_SERVERS}
mp.messaging.connector.smallrye-kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
mp.messaging.connector.smallrye-kafka.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
mp.messaging.connector.smallrye-kafka.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
mp.messaging.connector.smallrye-kafka.ssl.truststore.type=${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
mp.messaging.connector.smallrye-kafka.ssl.truststore.location=${KAFKA_SSL_TRUSTSTORE_LOCATION:ca.pem}
mp.messaging.incoming.addresses-sync.connector=smallrye-kafka
mp.messaging.incoming.addresses-sync.topic=addresses-sync
mp.messaging.incoming.addresses-sync.group.id=collections-service
mp.messaging.incoming.addresses-sync.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.addresses-sync.auto.offset.reset=earliest
mp.messaging.incoming.collector-sync.connector=smallrye-kafka
mp.messaging.incoming.collector-sync.topic=collector-sync
mp.messaging.incoming.collector-sync.group.id=collections-service
mp.messaging.incoming.collector-sync.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.collector-sync.auto.offset.reset=earliest
mp.messaging.incoming.collector-update.connector=smallrye-kafka
mp.messaging.incoming.collector-update.topic=collector-update
mp.messaging.incoming.collector-update.group.id=collections-service
mp.messaging.incoming.collector-update.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.collector-update.auto.offset.reset=earliest
# Reactive Messaging - Outgoing Channels (Producers)
mp.messaging.outgoing.collection-events-out.connector=smallrye-kafka
mp.messaging.outgoing.collection-events-out.topic=collection-events
mp.messaging.outgoing.collection-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Logging
quarkus.log.level=INFO
quarkus.log.category."org.example".level=DEBUG
# REST
quarkus.rest.path=/api
# Address enrichment configuration
enrichment.enabled=true
viacep.enabled=true
viacep.endpoint=https://viacep.com.br/ws
google.geocoding.base-url=${GOOGLE_GEOCODING_BASE_URL:https://maps.googleapis.com}
google.geocoding.api-key=${GOOGLE_GEOCODING_API_KEY:}
google.geocoding.timeout-ms=${GOOGLE_GEOCODING_TIMEOUT_MS:5000}
google.geocoding.country=${GOOGLE_GEOCODING_COUNTRY:Brazil}
enrichment.cache.ttl=86400
enrichment.timeout.ms=5000
enrichment.max-retries=2
# Route optimization configuration
routes.optimization.max-time-limit-seconds=30
routes.optimization.default-time-limit-seconds=5
routes.optimization.default-drop-penalty=100000
routes.optimization.max-candidates=100
routes.optimization.distance-provider=haversine
# Firebase Cloud Messaging
firebase.enabled=${FIREBASE_ENABLED:true}
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:/Users/lidiagaldino/progs/cyco/collections/cyco-collection-firebase-adminsdk-fbsvc-c1441a355e.json}
firebase.project-id=${FIREBASE_PROJECT_ID:cyco-collection}
firebase.dry-run=${FIREBASE_DRY_RUN:false}
# OpenRouteService route map configuration
openrouteservice.base-url=${OPENROUTESERVICE_BASE_URL:https://api.openrouteservice.org}
openrouteservice.api-key=${OPENROUTESERVICE_API_KEY:}
openrouteservice.timeout-ms=${OPENROUTESERVICE_TIMEOUT_MS:10000}
