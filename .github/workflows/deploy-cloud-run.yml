name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  REGISTER_SERVICE_BASE_URL: ${{ vars.REGISTER_SERVICE_BASE_URL }}
  FIREBASE_CREDENTIALS_FILE: cyco-collection-firebase-adminsdk-fbsvc-50baaa2af1.json

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: dev
    env:
      COMPLETION_CODE_KEY_ID: ${{ vars.COMPLETION_CODE_KEY_ID }}
      COMPLETION_CODE_ENCRYPTION_KEY: ${{ secrets.COMPLETION_CODE_ENCRYPTION_KEY }}
      COMPLETION_CODE_HMAC_KEY: ${{ secrets.COMPLETION_CODE_HMAC_KEY }}
      COMPLETION_CODE_ENCRYPTION_KEY_RING: ${{ secrets.COMPLETION_CODE_ENCRYPTION_KEY_RING || 'none' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          CA_PEM: ${{ secrets.CA_PEM }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          QUARKUS_MONGODB_CONNECTION_STRING: ${{ secrets.QUARKUS_MONGODB_CONNECTION_STRING }}
          QUARKUS_KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.QUARKUS_KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
          REGISTER_SERVICE_BASE_URL: ${{ vars.REGISTER_SERVICE_BASE_URL }}
        run: |
          test -n "$GCP_PROJECT_ID" || (echo "Missing repository variable GCP_PROJECT_ID" && exit 1)
          test -n "$GCP_REGION" || (echo "Missing repository variable GCP_REGION" && exit 1)
          test -n "$GAR_LOCATION" || (echo "Missing repository variable GAR_LOCATION" && exit 1)
          test -n "$GAR_REPOSITORY" || (echo "Missing repository variable GAR_REPOSITORY" && exit 1)
          test -n "$CLOUD_RUN_SERVICE" || (echo "Missing repository variable CLOUD_RUN_SERVICE" && exit 1)
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || (echo "Missing secret GCP_WORKLOAD_IDENTITY_PROVIDER" && exit 1)
          test -n "$GCP_SERVICE_ACCOUNT" || (echo "Missing secret GCP_SERVICE_ACCOUNT" && exit 1)
          test -n "$CA_PEM" || (echo "Missing secret CA_PEM" && exit 1)
          test -n "$FIREBASE_CREDENTIALS_JSON" || (echo "Missing secret FIREBASE_CREDENTIALS_JSON" && exit 1)
          test -n "$QUARKUS_MONGODB_CONNECTION_STRING" || (echo "Missing secret QUARKUS_MONGODB_CONNECTION_STRING" && exit 1)
          case "$QUARKUS_MONGODB_CONNECTION_STRING" in
            mongodb://*|mongodb+srv://*) ;;
            *) echo "Secret QUARKUS_MONGODB_CONNECTION_STRING must start with mongodb:// or mongodb+srv:// (do not include quotes or leading spaces)"; exit 1 ;;
          esac
          test -n "$QUARKUS_KAFKA_BOOTSTRAP_SERVERS" || (echo "Missing secret QUARKUS_KAFKA_BOOTSTRAP_SERVERS" && exit 1)
          test -n "$KAFKA_USERNAME" || (echo "Missing secret KAFKA_USERNAME" && exit 1)
          test -n "$KAFKA_PASSWORD" || (echo "Missing secret KAFKA_PASSWORD" && exit 1)
          test -n "$REGISTER_SERVICE_BASE_URL" || (echo "Missing repository variable REGISTER_SERVICE_BASE_URL (public base URL of cyco-register)" && exit 1)
          case "$REGISTER_SERVICE_BASE_URL" in
            https://*) ;;
            *) echo "Repository variable REGISTER_SERVICE_BASE_URL must start with https://"; exit 1 ;;
          esac

      - name: Validate completion code keys
        shell: python
        run: |
          import base64
          import binascii
          import os

          def validate_key(name, value):
              try:
                  decoded = base64.b64decode(value, validate=True)
              except (ValueError, binascii.Error):
                  raise SystemExit(f"{name} must be valid base64")
              if len(decoded) != 32:
                  raise SystemExit(f"{name} must decode to exactly 32 bytes")

          key_id = os.environ["COMPLETION_CODE_KEY_ID"]
          if not key_id.strip() or key_id == "unset":
              raise SystemExit("Missing variable COMPLETION_CODE_KEY_ID")
          for name in ("COMPLETION_CODE_ENCRYPTION_KEY", "COMPLETION_CODE_HMAC_KEY"):
              validate_key(name, os.environ[name])
          ring = os.environ["COMPLETION_CODE_ENCRYPTION_KEY_RING"]
          if ring.strip() and ring.strip().lower() != "none":
              seen = {key_id}
              for entry in ring.split(","):
                  retired_id, separator, value = entry.partition(":")
                  retired_id = retired_id.strip()
                  if not separator or not retired_id or retired_id in seen:
                      raise SystemExit("Invalid COMPLETION_CODE_ENCRYPTION_KEY_RING key IDs or format")
                  validate_key("COMPLETION_CODE_ENCRYPTION_KEY_RING entry", value.strip())
                  seen.add(retired_id)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Create build-time secret files
        env:
          CA_PEM: ${{ secrets.CA_PEM }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$CA_PEM" > ca.pem
          printf '%s' "$FIREBASE_CREDENTIALS_JSON" > "$FIREBASE_CREDENTIALS_FILE"

      - name: Build image
        run: |
          IMAGE="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --tag "$IMAGE" .

      - name: Push image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        env:
          QUARKUS_MONGODB_CONNECTION_STRING: ${{ secrets.QUARKUS_MONGODB_CONNECTION_STRING }}
          QUARKUS_KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.QUARKUS_KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
          GOOGLE_GEOCODING_API_KEY: ${{ secrets.GOOGLE_GEOCODING_API_KEY }}
          OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}
          REGISTER_SERVICE_BASE_URL: ${{ vars.REGISTER_SERVICE_BASE_URL }}
        run: |
          cat > cloud-run-env.yaml <<EOF
          FIREBASE_ENABLED: "true"
          FIREBASE_CREDENTIALS_PATH: "/app/credentials.json"
          FIREBASE_PROJECT_ID: "$GCP_PROJECT_ID"
          FIREBASE_DRY_RUN: "false"
          KAFKA_SSL_TRUSTSTORE_LOCATION: "/app/ca.pem"
          QUARKUS_MONGODB_CONNECTION_STRING: "$QUARKUS_MONGODB_CONNECTION_STRING"
          QUARKUS_KAFKA_BOOTSTRAP_SERVERS: "$QUARKUS_KAFKA_BOOTSTRAP_SERVERS"
          KAFKA_USERNAME: "$KAFKA_USERNAME"
          KAFKA_PASSWORD: "$KAFKA_PASSWORD"
          GOOGLE_GEOCODING_API_KEY: "$GOOGLE_GEOCODING_API_KEY"
          OPENROUTESERVICE_API_KEY: "$OPENROUTESERVICE_API_KEY"
          REGISTER_SERVICE_BASE_URL: "$REGISTER_SERVICE_BASE_URL"
          EOF

          python3 - <<'PY'
          import json
          import os

          with open("cloud-run-env.yaml", "a") as output:
              for name in ("COMPLETION_CODE_KEY_ID", "COMPLETION_CODE_ENCRYPTION_KEY",
                           "COMPLETION_CODE_HMAC_KEY", "COMPLETION_CODE_ENCRYPTION_KEY_RING"):
                  output.write(f"{name}: {json.dumps(os.environ[name])}\n")
          PY

          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE" \
            --platform managed \
            --allow-unauthenticated \
            --env-vars-file cloud-run-env.yaml \
            --timeout 300
